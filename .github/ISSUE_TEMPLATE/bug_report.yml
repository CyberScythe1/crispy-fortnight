---
name: Bug Report
description: File a bug report
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: dropdown
    id: project
    attributes:
      label: Which project?
      options:
        - FS-04: Multi-Tenant Project Management
        - FS-02: Real-Time Collaborative Workspace
        - Shared/Infrastructure
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Which component?
      options:
        - Backend API
        - Frontend UI
        - Database/Prisma
        - Authentication
        - Real-time (Socket.io/Yjs)
        - Docker/Infrastructure
        - Testing
        - Documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version/Commit
      description: What version or commit are you running?
      placeholder: "e.g., main@a1b2c3d or v1.2.3"
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "When I do X, Y happens instead of Z..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: "I expected..."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: "Instead, this happened..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs/Error Messages
      description: If applicable, add logs, error messages, or stack traces
      placeholder: "Paste logs here..."
      render: shell
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Where did this happen?
      placeholder: |
        - OS: Ubuntu 22.04 / Windows 11 / macOS
        - Browser: Chrome 120 / Firefox 121
        - Node: 20.x
        - Docker: 24.x
        - Database: PostgreSQL 16
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to avoid duplicates
          required: true
        - label: I have provided all necessary information
          required: true
        - label: I can reproduce this consistently
          required: false