---
name: Feature Request
description: Suggest an idea for this project
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature!
  - type: dropdown
    id: project
    attributes:
      label: Which project?
      options:
        - FS-04: Multi-Tenant Project Management
        - FS-02: Real-Time Collaborative Workspace
        - Shared/Infrastructure
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: What type of feature?
      options:
        - New API endpoint
        - New UI component/page
        - Database schema change
        - Real-time feature
        - Performance improvement
        - Security enhancement
        - Developer experience
        - Integration/Third-party
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What's the pain point?
      placeholder: "Currently, users cannot..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like
      placeholder: "I'd like to see..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered
      placeholder: "I considered..."
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context, mockups, or references
      placeholder: "Links to references, mockups, related issues..."
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues/PRs to avoid duplicates
          required: true
        - label: This aligns with the project roadmap
          required: true