name: CD - Production Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Version/tag to deploy (optional, defaults to latest main)'
        required: false
        type: string

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy-staging:
    name: Deploy to Staging
    if: github.event.workflow_dispatch.inputs.environment == 'staging' || github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Staging
        run: |
          echo "Deploying to staging environment..."
          # Add your staging deployment commands here
          # Example: kubectl apply -f k8s/staging/
          # Or: docker-compose -f docker-compose.staging.yml up -d

  deploy-production:
    name: Deploy to Production
    if: github.event.workflow_dispatch.inputs.environment == 'production' || github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull production images
        run: |
          docker pull ghcr.io/${{ github.repository }}/fs04-backend:${{ github.sha }}
          docker pull ghcr.io/${{ github.repository }}/fs04-frontend:${{ github.sha }}
          docker pull ghcr.io/${{ github.repository }}/fs02-backend:${{ github.sha }}
          docker pull ghcr.io/${{ github.repository }}/fs02-frontend:${{ github.sha }}

      - name: Deploy to Production
        run: |
          echo "Deploying to production environment..."
          # Add your production deployment commands here
          # Example: kubectl apply -f k8s/production/
          # Or: docker-compose -f docker-compose.prod.yml up -d
        env:
          DEPLOY_VERSION: ${{ github.sha }}

  rollback:
    name: Rollback Deployment
    if: github.event.workflow_dispatch.inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rollback to previous version
        run: |
          echo "Rolling back to previous version..."
          # Add your rollback commands here
          # Example: kubectl rollout undo deployment/fs04-backend
          # Or: docker-compose -f docker-compose.prod.yml up -d --scale fs04-backend=1 --scale fs02-backend=1