name: CI - Crispy Fortnight Monorepo

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/fs04-multi-tenant-pm/**'
      - 'packages/fs02-realtime-collab/**'
      - 'packages/shared/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/fs04-multi-tenant-pm/**'
      - 'packages/fs02-realtime-collab/**'
      - 'packages/shared/**'
      - '.github/workflows/ci.yml'

env:
  NODE_VERSION: '20'

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      # FS-04 Backend
      - name: Install FS-04 backend dependencies
        run: npm ci
        working-directory: packages/fs04-multi-tenant-pm/backend

      - name: Lint FS-04 backend
        run: npm run lint
        working-directory: packages/fs04-multi-tenant-pm/backend

      # FS-04 Frontend
      - name: Install FS-04 frontend dependencies
        run: npm ci
        working-directory: packages/fs04-multi-tenant-pm/frontend

      - name: Typecheck FS-04 frontend
        run: npx tsc --noEmit
        working-directory: packages/fs04-multi-tenant-pm/frontend

      - name: Lint FS-04 frontend
        run: npm run lint
        working-directory: packages/fs04-multi-tenant-pm/frontend

      # FS-02 Backend
      - name: Install FS-02 backend dependencies
        run: npm ci
        working-directory: packages/fs02-realtime-collab/backend

      - name: Lint FS-02 backend
        run: npm run lint
        working-directory: packages/fs02-realtime-collab/backend

      # FS-02 Frontend
      - name: Install FS-02 frontend dependencies
        run: npm ci
        working-directory: packages/fs02-realtime-collab/frontend

      - name: Typecheck FS-02 frontend
        run: npx tsc --noEmit
        working-directory: packages/fs02-realtime-collab/frontend

      - name: Lint FS-02 frontend
        run: npm run lint
        working-directory: packages/fs02-realtime-collab/frontend

      # Shared
      - name: Install shared dependencies
        run: npm ci
        working-directory: packages/shared

      - name: Build shared
        run: npm run build
        working-directory: packages/shared

  test-fs04-backend:
    name: FS-04 Backend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/fs04-multi-tenant-pm/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crispy
          POSTGRES_PASSWORD: crispy_test_password
          POSTGRES_DB: fs04_pm_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U crispy"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/fs04-multi-tenant-pm/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://crispy:crispy_test_password@localhost:5432/fs04_pm_test

      - name: Run unit tests
        run: npm test
        env:
          DATABASE_URL: postgresql://crispy:crispy_test_password@localhost:5432/fs04_pm_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_secret_key_for_testing_min_32_chars_long
          NODE_ENV: test

  test-fs02-backend:
    name: FS-02 Backend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/fs02-realtime-collab/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crispy
          POSTGRES_PASSWORD: crispy_test_password
          POSTGRES_DB: fs02_collab_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U crispy"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/fs02-realtime-collab/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://crispy:crispy_test_password@localhost:5432/fs02_collab_test

      - name: Run unit tests
        run: npm test
        env:
          DATABASE_URL: postgresql://crispy:crispy_test_password@localhost:5432/fs02_collab_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_secret_key_for_testing_min_32_chars_long
          NODE_ENV: test

  test-frontend:
    name: Frontend Unit Tests (Both Projects)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      # FS-04 Frontend
      - name: Install FS-04 frontend dependencies
        run: npm ci
        working-directory: packages/fs04-multi-tenant-pm/frontend

      - name: Run FS-04 frontend tests
        run: npm test
        working-directory: packages/fs04-multi-tenant-pm/frontend

      # FS-02 Frontend
      - name: Install FS-02 frontend dependencies
        run: npm ci
        working-directory: packages/fs02-realtime-collab/frontend

      - name: Run FS-02 frontend tests
        run: npm test
        working-directory: packages/fs02-realtime-collab/frontend

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crispy
          POSTGRES_PASSWORD: crispy_test_password
          POSTGRES_DB: fs04_pm_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U crispy"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      # FS-04 Backend
      - name: Install FS-04 backend dependencies
        run: npm ci
        working-directory: packages/fs04-multi-tenant-pm/backend

      - name: Generate Prisma Client (FS-04)
        run: npx prisma generate
        working-directory: packages/fs04-multi-tenant-pm/backend

      - name: Run database migrations (FS-04)
        run: npx prisma migrate deploy
        working-directory: packages/fs04-multi-tenant-pm/backend
        env:
          DATABASE_URL: postgresql://crispy:crispy_test_password@localhost:5432/fs04_pm_test

      # FS-02 Backend
      - name: Install FS-02 backend dependencies
        run: npm ci
        working-directory: packages/fs02-realtime-collab/backend

      - name: Generate Prisma Client (FS-02)
        run: npx prisma generate
        working-directory: packages/fs02-realtime-collab/backend

      - name: Run database migrations (FS-02)
        run: npx prisma migrate deploy
        working-directory: packages/fs02-realtime-collab/backend
        env:
          DATABASE_URL: postgresql://crispy:crispy_test_password@localhost:5432/fs02_collab_test

      # FS-04 Frontend
      - name: Install FS-04 frontend dependencies
        run: npm ci
        working-directory: packages/fs04-multi-tenant-pm/frontend

      - name: Build FS-04 frontend
        run: npm run build
        working-directory: packages/fs04-multi-tenant-pm/frontend

      # FS-02 Frontend
      - name: Install FS-02 frontend dependencies
        run: npm ci
        working-directory: packages/fs02-realtime-collab/frontend

      - name: Build FS-02 frontend
        run: npm run build
        working-directory: packages/fs02-realtime-collab/frontend

      - name: Start FS-04 backend server
        run: |
          npm run dev &
          sleep 15
        working-directory: packages/fs04-multi-tenant-pm/backend
        env:
          DATABASE_URL: postgresql://crispy:crispy_test_password@localhost:5432/fs04_pm_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_secret_key_for_testing_min_32_chars_long
          NODE_ENV: test

      - name: Start FS-02 backend server
        run: |
          npm run dev &
          sleep 15
        working-directory: packages/fs02-realtime-collab/backend
        env:
          DATABASE_URL: postgresql://crispy:crispy_test_password@localhost:5432/fs02_collab_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_secret_key_for_testing_min_32_chars_long
          NODE_ENV: test

      - name: Start FS-04 frontend server
        run: |
          npm run preview -- --port 3001 &
          sleep 10
        working-directory: packages/fs04-multi-tenant-pm/frontend

      - name: Start FS-02 frontend server
        run: |
          npm run preview -- --port 3002 &
          sleep 10
        working-directory: packages/fs02-realtime-collab/frontend

      - name: Wait for servers to be ready
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:4001/health && curl -f http://localhost:4002/health && curl -f http://localhost:3001 && curl -f http://localhost:3002; then
              echo "All servers ready"
              exit 0
            fi
            echo "Waiting for servers... attempt $i"
            sleep 2
          done
          echo "Servers not ready after 60 seconds"
          exit 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: .

      - name: Run FS-04 E2E tests
        run: npx playwright test
        working-directory: packages/fs04-multi-tenant-pm

      - name: Run FS-02 E2E tests
        run: npx playwright test
        working-directory: packages/fs02-realtime-collab

  build-and-push:
    name: Build & Push Docker Images
    needs: [lint-and-typecheck, test-fs04-backend, test-fs02-backend, test-frontend, e2e-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push FS-04 Backend
        uses: docker/build-push-action@v5
        with:
          context: ./packages/fs04-multi-tenant-pm/backend
          push: true
          tags: ghcr.io/${{ github.repository }}/fs04-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push FS-04 Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./packages/fs04-multi-tenant-pm/frontend
          push: true
          tags: ghcr.io/${{ github.repository }}/fs04-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push FS-02 Backend
        uses: docker/build-push-action@v5
        with:
          context: ./packages/fs02-realtime-collab/backend
          push: true
          tags: ghcr.io/${{ github.repository }}/fs02-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push FS-02 Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./packages/fs02-realtime-collab/frontend
          push: true
          tags: ghcr.io/${{ github.repository }}/fs02-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max