version: 2
updates:
  # Backend dependencies for FS-04
  - package-ecosystem: "npm"
    directory: "/packages/fs04-multi-tenant-pm/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "fs04"
      - "backend"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
    open-pull-requests-limit: 10
    reviewers:
      - "CyberScythe1"
    assignees:
      - "CyberScythe1"

  # Frontend dependencies for FS-04
  - package-ecosystem: "npm"
    directory: "/packages/fs04-multi-tenant-pm/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "fs04"
      - "frontend"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
    open-pull-requests-limit: 10
    reviewers:
      - "CyberScythe1"
    assignees:
      - "CyberScythe1"

