version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: crispy-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crispy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crispy_dev_password}
      POSTGRES_MULTIPLE_DATABASES: fs04_pm,fs02_collab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crispy}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crispy-network

  # Redis for caching, sessions, pub/sub
  redis:
    image: redis:7-alpine
    container_name: crispy-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-crispy_redis_password}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crispy-network

  # FS-04 Backend API
  fs04-backend:
    build:
      context: .
      dockerfile: packages/fs04-multi-tenant-pm/backend/Dockerfile.dev
    container_name: fs04-backend
    environment:
      NODE_ENV: development
      PORT: 4001
      DATABASE_URL: postgresql://${POSTGRES_USER:-crispy}:${POSTGRES_PASSWORD:-crispy_dev_password}@postgres:5432/fs04_pm
      REDIS_URL: redis://:${REDIS_PASSWORD:-crispy_redis_password}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-fs04_dev_jwt_secret_change_in_production_min_32_chars}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      CORS_ORIGIN: http://localhost:3001
    ports:
      - "4001:4001"
    volumes:
      - ./packages/fs04-multi-tenant-pm/backend/src:/app/src
      - ./packages/fs04-multi-tenant-pm/backend/prisma:/app/prisma
      - ./packages/shared:/app/packages/shared
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crispy-network
    command: >
      sh -c "npx prisma migrate deploy &&
             npx prisma generate &&
             node src/server.js"

  # FS-04 Frontend
  fs04-frontend:
    build:
      context: ./packages/fs04-multi-tenant-pm/frontend
      dockerfile: Dockerfile.dev
    container_name: fs04-frontend
    environment:
      VITE_API_URL: http://localhost:4001/api/v1
      VITE_WS_URL: ws://localhost:4001
    ports:
      - "3001:3001"
    volumes:
      - ./packages/fs04-multi-tenant-pm/frontend/src:/app/src
      - ./packages/fs04-multi-tenant-pm/frontend/public:/app/public
    depends_on:
      - fs04-backend
    networks:
      - crispy-network

  # FS-02 Backend API + WebSocket
  fs02-backend:
    build:
      context: .
      dockerfile: packages/fs02-realtime-collab/backend/Dockerfile.dev
    container_name: fs02-backend
    environment:
      NODE_ENV: development
      PORT: 4002
      WS_PORT: 4003
      DATABASE_URL: postgresql://${POSTGRES_USER:-crispy}:${POSTGRES_PASSWORD:-crispy_dev_password}@postgres:5432/fs02_collab
      REDIS_URL: redis://:${REDIS_PASSWORD:-crispy_redis_password}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-fs02_dev_jwt_secret_change_in_production_min_32_chars}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3002
    ports:
      - "4002:4002"
      - "4003:4003"
    volumes:
      - ./packages/fs02-realtime-collab/backend/src:/app/src
      - ./packages/fs02-realtime-collab/backend/prisma:/app/prisma
      - ./packages/shared:/app/packages/shared
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crispy-network
    command: >
      sh -c "npx prisma migrate deploy &&
             npx prisma generate &&
             node src/server.js"

  # FS-02 Frontend
  fs02-frontend:
    build:
      context: ./packages/fs02-realtime-collab/frontend
      dockerfile: Dockerfile.dev
    container_name: fs02-frontend
    environment:
      VITE_API_URL: http://localhost:4002/api/v1
      VITE_WS_URL: ws://localhost:4003
    ports:
      - "3002:3002"
    volumes:
      - ./packages/fs02-realtime-collab/frontend/src:/app/src
      - ./packages/fs02-realtime-collab/frontend/public:/app/public
    depends_on:
      - fs02-backend
    networks:
      - crispy-network

networks:
  crispy-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: